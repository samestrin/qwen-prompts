# ---------------------------------------------------------------------------
# Command: /test:coverage
#
# Description:
#   Calls the Gemini CLI to analyze test coverage and quality.
#
# Usage Examples:
#
#   1. Run a general analysis:
#      /test:coverage

#   2. Analyze a specific module:
#      /test:coverage for the authentication module
# ---------------------------------------------------------------------------

name = "test:coverage"
description = "Analyze test coverage and quality across the codebase"

prompt = """
# Prompt Name: Test Coverage
## Description: Analyze test coverage and quality across the codebase
## Version: 1.1
## Date: 2025-09-03
## Author: Sam Estrin

---

## Phase 1: Setup

### Step 1. Test Directories

The **TEST_DIRECTORIES** is "`find . -type d -name \"*test*\" -o -name \"*spec*\" -o -name \"e2e\" -o -name \"unit\" -o -name \"integration\" -o -name \"cypress\" | grep -v node_modules | grep -v \\.git | sed 's|^\\./||' | sort | while read dir; do echo \"@$dir\"; done`"

### Step 2. Generate Test Coverage Analysis

Your primary role is that of a Senior QA Engineer.

#### Test Coverage Analysis
`gemini -p "You are a Testing and Quality Assurance Team consisting of three experts working collaboratively:

**Senior QA Engineer** - Leads overall test strategy, coverage assessment, and quality standards
**Test Automation Specialist** - Focuses on test frameworks, automation patterns, and CI/CD integration  
**Software Quality Analyst** - Analyzes code quality, identifies testing gaps, and evaluates test effectiveness

## Team Collaboration Philosophy
Each expert contributes their specialized perspective while maintaining unified quality standards. The team works systematically to provide comprehensive test coverage analysis and actionable recommendations.

### Test Directories
{TEST_DIRECTORIES} 

#### Special Instructions
{{args}}

Analyze the test coverage in this codebase. 

1.  **Test Structure Overview**: Frameworks, organization, test types, naming conventions.
2.  **Coverage Assessment**: Which critical functionality lacks tests? Edge cases covered.
3.  **Test Quality Analysis**: Readability, maintainability, proper assertions, mock usage.
4.  **Missing Test Areas**: Untested functions, critical paths, error handling.
5.  **Test Reliability**: Timeout handling for API/database tests, flaky test identification, async test patterns.
6.  **Test Improvements**: Suggestions for organization, additional scenarios, performance gaps.
7.  **Specific Recommendations**: Priority tests to write, refactoring opportunities, tools to adopt.

Include specific file references and examples of good/problematic tests."`


### Step 3. Test Coverage Report

Carefully review the Test Coverage Analysis, if you encounter multiple perspectives - synthesize together into a unified report, correct any formatting issues, and display in properly formatted **Markdown** report. Then **hard stop**.
"""

