# ---------------------------------------------------------------------------
# Command: /code:review
#
# Description:
#   Calls the Gemini CLI to perform a comprehensive code review,
#   analyzing code quality, security, performance, and best practices.
#
# Usage Examples:
#
#   1. Review the entire codebase:
#      /code:review
#
#   2. Review specific files or directories:
#      /code:review @src/auth/ @src/api/
#
#   3. Focus on specific aspects:
#      /code:review focusing on security vulnerabilities and performan# Prompt Name: Code Analysis
# ---------------------------------------------------------------------------

name = "code:review"
description = "Comprehensive comprehensive code review, analyzing code quality, security, performance, and best practices"

prompt = """
# Prompt Name: Code Review
## Description: Comprehensive comprehensive code review, analyzing code quality, security, performance, and best practices
## Version: 1.0
## Date: 2025-09-03
## Author: Sam Estrin

---

## Phase 1. Setup

### Step 1. Argument Processing

**Set mode based on "{{args}}":**
1. CLEAN_ARGS (string) is "{{args}}"
2. If "{CLEAN_ARGS}" contains `@`, **TARGETS** is the path/to/filename(s) including `@`, otherwise **TARGETS** is "false". Remove {TARGETS} from {CLEAN_ARGS}.
3. If "{CLEAN_ARGS}" contains "--comprehensive", **COMPREHENSIVE** is "true" and **REPORT_TITLE** is "Comprehensive Code Review", otherwise "false" and **REPORT_TITLE** is "Code Review". Remove "--comprehensive" from {CLEAN_ARGS}.

Say "Generating {REPORT_TITLE} report ... [Mode: Comprehensive:{COMPREHENSIVE}, Target(s):{TARGETS}]"

### Step 2. Conditional Directory Detection and Standards Scan

**If {TARGETS} is not "false" the **RESPONSE** is "`echo '# MAIN_DIRECTORIES'; echo '{TARGETS}'; echo '# CODING_STANDARDS'; cat ./planning/specifications/sprint-coding-standards.md 2>/dev/null || echo 'No coding standards found'; echo '# IMPLEMENTATION_STANDARDS'; cat ./planning/specifications/implementation-standards.md 2>/dev/null || echo 'No implementation standards found - using default analysis approach'`"

**If {TARGETS} is "false"** the **RESPONSE** is "`echo '# MAIN_DIRECTORIES'; gemini -p \"Find directories containing runtime code  (including both runtime and test code) - for a code review, return only the directory basenames preceded by @ in a single line, separated by spaces\"; echo '# CODING_STANDARDS'; cat ./planning/specifications/sprint-coding-standards.md 2>/dev/null || echo 'No coding standards found'; echo '# IMPLEMENTATION_STANDARDS'; cat ./planning/specifications/implementation-standards.md 2>/dev/null || echo 'No implementation standards found - using default analysis approach'`"

### Step 3. Set Defaults

#### Default Code Quality Strategy

**Code Quality Principles:**
- Write clean, readable, and maintainable code
- Follow established coding standards and best practices
- Implement proper error handling and logging
- Ensure adequate test coverage and documentation
- Optimize for long-term maintainability over short-term convenience

**Quality Assessment Framework:**
1. **Readability**: Code should be self-documenting and easy to understand
2. **Maintainability**: Changes should be easy to implement without breaking existing functionality
3. **Testability**: Code should be designed to facilitate comprehensive testing
4. **Performance**: Efficient algorithms and resource usage
5. **Security**: Proper input validation and secure coding practices
6. **Documentation**: Clear comments and comprehensive documentation

**Implementation Standards:**
- Follow SOLID principles and design patterns
- Implement consistent naming conventions
- Maintain appropriate function and class sizes
- Use proper abstraction and encapsulation
- Implement comprehensive error handling
- Ensure adequate logging and monitoring

**Quality Metrics:**
- Code complexity and cyclomatic complexity
- Test coverage and quality of tests
- Documentation coverage and quality
- Performance benchmarks and bottleneck identification
- Security vulnerability assessment
- Technical debt and refactoring opportunities

### Step 4. Extract from Response

Extract **MAIN_DIRECTORIES**, **CODING_STANDARDS**, and **IMPLEMENTATION_STANDARDS** from {RESPONSE}. If the **MAIN_DIRECTORIES** cannot be extracted, then set **MAIN_DIRECTORIES** to ".". If **CODING_STANDARDS** is "No coding standards found" then set **CODING_STANDARDS** to "Use general best practices". If {IMPLEMENTATION_STANDARDS} is "No implementation standards found - using default analysis approach" then set **IMPLEMENTATION_STANDARDS** to the **Default Code Quality Strategy**.

## Phase 2. Code Review

### Step 1. Perform Code Review

You are an expert code review consultant with extensive experience in software engineering, security, and performance optimization.

#### Comprehensive Code Review
`gemini -p "**ANALYSIS SCOPE**: {MAIN_DIRECTORIES}

You are a team of code review experts consisting of:
1. **Senior Software Architect** - Focus on architecture, design patterns, and system structure
2. **Security Specialist** - Focus on security vulnerabilities and secure coding practices  
3. **Performance Engineer** - Focus on performance optimization and efficiency
4. **Code Quality Lead** - Focus on maintainability, readability, and best practices

Each team member should individually analyze the codebase from their expertise perspective, then collaborate to create a unified comprehensive code review.

**IMPORTANT**: Focus your analysis ONLY on the files/directories specified in the ANALYSIS SCOPE above. Do not analyze the entire codebase unless the scope indicates to do so.

{CLEAN_ARGS}

Your review should include:

### 1. Code Quality Analysis
- **Code Structure**: Architecture patterns, modularity, separation of concerns
- **Naming Conventions**: Variables, functions, classes, files consistency
- **Code Complexity**: Cyclomatic complexity, nested logic, function length
- **DRY Principle**: Code duplication identification and refactoring opportunities
- **SOLID Principles**: Single responsibility, open/closed, dependency inversion adherence

### 2. Security Review
- **Input Validation**: SQL injection, XSS, CSRF protection
- **Authentication & Authorization**: Proper implementation, session management
- **Data Handling**: Sensitive data exposure, encryption, secure storage
- **Dependencies**: Known vulnerabilities in third-party packages
- **API Security**: Rate limiting, input sanitization, error handling

### 3. Performance Analysis
- **Database Queries**: N+1 problems, indexing, query optimization
- **Memory Usage**: Memory leaks, inefficient data structures
- **Algorithm Efficiency**: Time complexity, unnecessary computations
- **Caching Strategies**: Implementation and effectiveness
- **Resource Management**: File handles, connections, cleanup

### 4. Best Practices Compliance
- **Error Handling**: Proper exception handling, logging, user feedback
- **Testing**: Unit tests, integration tests, test coverage
- **Documentation**: Code comments, API documentation, README files
- **Version Control**: Commit messages, branching strategy, code organization
- **Configuration Management**: Environment variables, secrets handling

### 5. Maintainability Assessment
- **Code Readability**: Clear logic flow, appropriate comments
- **Refactoring Opportunities**: Technical debt identification
- **Scalability Concerns**: Performance bottlenecks, architectural limitations
- **Dependency Management**: Outdated packages, unnecessary dependencies

### 6. Language/Framework Specific Issues
- **Language Idioms**: Proper use of language features and conventions
- **Framework Best Practices**: Correct usage of chosen frameworks
- **Type Safety**: Static typing usage, null safety

For each issue identified:
- Provide specific file and line references
- Explain the problem and its impact
- Suggest concrete solutions with code examples when applicable
- Assign severity level (Critical/High/Medium/Low)

Focus on actionable feedback that will improve code quality, security, and maintainability.`

### Step 2. Set Template

#### Professional Code Review Report Template

##### Executive Summary
- Overall code quality assessment and maturity level
- Key strengths and critical areas of concern
- Security posture and risk assessment
- Immediate action items requiring attention

**Important Disclaimers:**
- This analysis is based on static code review and may not detect all runtime issues
- Some recommendations may require additional context about business requirements
- Consider using specialized tools for comprehensive security scanning and performance profiling
- This review focuses on code quality, maintainability, and common best practices

##### Code Quality Assessment
**Strengths**
- Well-implemented features and practices
- Code quality highlights
- Architectural strengths

**Areas for Improvement**
- Code quality concerns
- Maintainability issues
- Technical debt identification

##### Security Analysis
**Security Strengths**
- Proper security implementations
- Good security practices identified

**Security Concerns**
- Vulnerabilities and security risks
- Authentication and authorization issues
- Data handling and privacy concerns

##### Performance Review
**Performance Strengths**
- Efficient implementations
- Good performance practices

**Performance Issues**
- Bottlenecks and optimization opportunities
- Resource usage concerns
- Scalability limitations

##### Architecture & Design
**Design Strengths**
- Good architectural decisions
- Proper design pattern usage
- Code organization highlights

**Design Concerns**
- Architectural issues
- Design pattern misuse
- Modularity and separation concerns

##### Risk Assessment
**Critical Issues** (Immediate Attention)
- Security vulnerabilities
- System-breaking bugs
- Data integrity risks

**High Priority Issues** (Next Sprint)
- Performance bottlenecks
- Significant maintainability issues
- Important security improvements

**Medium Priority Issues** (Next Quarter)
- Code quality improvements
- Minor refactoring opportunities
- Moderate technical debt

**Low Priority Issues** (Future Considerations)
- Style improvements
- Documentation updates
- Minor optimizations

##### Technical Analysis _(only included with --comprehensive flag)_
**Detailed Code References**
- Specific file paths and line numbers for each issue
- Code snippets demonstrating problems and solutions
- Implementation examples with before/after comparisons

**Architecture Deep Dive**
- Design pattern analysis and recommendations
- Dependency injection and inversion of control assessment
- Module coupling and cohesion evaluation
- Scalability bottlenecks and architectural constraints

**Performance Metrics**
- Algorithm complexity analysis (Big O notation)
- Memory usage patterns and optimization opportunities
- Database query performance and indexing strategies
- Caching implementation effectiveness

**Security Technical Details**
- Vulnerability exploitation scenarios
- Security control implementation specifics
- Cryptographic implementation review
- Input validation and sanitization techniques

**Code Quality Metrics**
- Cyclomatic complexity measurements
- Code duplication analysis with specific examples
- Test coverage gaps with recommended test cases
- Documentation quality assessment

**Refactoring Roadmap**
- Step-by-step refactoring instructions
- Risk assessment for each proposed change
- Backward compatibility considerations
- Migration strategies for breaking changes

##### Recommendations
- Prioritized action plan
- Implementation roadmap
- Resource requirements
- Success metrics and validation

### Step 3. Generate Code Review Report

Carefully review the Code Review Analysis, and display a single, properly formatted **Markdown** report using the **Professional Code Review Report Template**.

**Important formatting rules:**
- Use "# {REPORT_TITLE}" as the main heading
- For each issue identified, provide specific file and line references
- Include concrete solutions with code examples when applicable
- Group issues by category within each priority level
- Focus on actionable feedback that improves code quality, security, and maintainability
- If {COMPREHENSIVE} is "true", include the "##### Technical Analysis" section with detailed technical findings, code references, and implementation details
- If {COMPREHENSIVE} is "false", completely omit the "##### Technical Analysis" section and its content
- Do not show any Todos/Task Lists, end with the report. Then **hard stop**.
"""