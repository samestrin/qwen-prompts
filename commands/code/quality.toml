# ---------------------------------------------------------------------------
# Command: /code:quality
#
# Description:
#   Calls the Gemini CLI to perform a comprehensive code quality analysis.
#
# Usage Examples:
#
#   1. Run a general analysis:
#      /code:quality
#
#   2. Focus the analysis on a specific area:
#      /code:quality focusing on naming conventions and code complexity
# ---------------------------------------------------------------------------

name = "code:quality"
description = "Comprehensive code quality analysis including maintainability, readability, and best practices"

prompt = """
# Prompt Name: Code Analysis
## Description: Analyze entire codebase architecture and structure using Gemini's large context window
## Version: 1.0
## Date: 2025-09-03
## Author: Sam Estrin

---

## Phase 1. Setup

### Step 1. Combined Directory Detection and Standards Scan

The **RESPONSE** is "`echo '# MAIN_DIRECTORIES'; gemini -p "Find directories containing code - for a code quality assessment, return only the directory basenames preceded by @ in a single line, separated by spaces"; echo '# CODING_STANDARDS'; cat ./planning/specifications/sprint-coding-standards.md 2>/dev/null || echo 'No coding standards found'; echo '# IMPLEMENTATION_STANDARDS'; cat ./planning/specifications/implementation-standards.md 2>/dev/null || echo 'No implementation standards found - using default analysis approach'`"

### Step 2. Set Defaults

#### Default Code Quality Strategy

**Code Quality Principles:**
- Write clean, readable, and maintainable code
- Follow established coding standards and best practices
- Implement proper error handling and logging
- Ensure adequate test coverage and documentation
- Optimize for long-term maintainability over short-term convenience

**Quality Assessment Framework:**
1. **Readability**: Code should be self-documenting and easy to understand
2. **Maintainability**: Changes should be easy to implement without breaking existing functionality
3. **Testability**: Code should be designed to facilitate comprehensive testing
4. **Performance**: Efficient algorithms and resource usage
5. **Security**: Proper input validation and secure coding practices
6. **Documentation**: Clear comments and comprehensive documentation

**Implementation Standards:**
- Follow SOLID principles and design patterns
- Implement consistent naming conventions
- Maintain appropriate function and class sizes
- Use proper abstraction and encapsulation
- Implement comprehensive error handling
- Ensure adequate logging and monitoring

**Quality Metrics:**
- Code complexity and cyclomatic complexity
- Test coverage and quality of tests
- Documentation coverage and quality
- Performance benchmarks and bottleneck identification
- Security vulnerability assessment
- Technical debt and refactoring opportunities

### Step 3. Extract from Response

Extract **MAIN_DIRECTORIES**, **CODING_STANDARDS**, and **IMPLEMENTATION_STANDARDS** from {RESPONSE}. If the **MAIN_DIRECTORIES** cannot be extracted, then set **MAIN_DIRECTORIES** to ".". If **CODING_STANDARDS** is "No coding standards found" then set **CODING_STANDARDS** to "Use general best practices". If {IMPLEMENTATION_STANDARDS} is "No implementation standards found - using default analysis approach" then set **IMPLEMENTATION_STANDARDS** to the **Default Code Quality Strategy**.

## Phase 2. Code Quality

### Step 1. Evaluate Code Quality

You are an expert code quality consultant providing professional code quality assessments. You **cannot** install any new tools, you must work with what is available. You **can** suggest the user installs and runs 3rd party tools if applicable.

#### Code Quality Assessment
`gemini -p "{MAIN_DIRECTORIES} You are a team of code quality experts working together - a senior software architect, code quality specialist, and technical lead. Each team member must provide their individual analysis from their expertise perspective, then work together to create a comprehensive code quality analysis that leverages all of your inputs into a single unified report. {{args}}

1.  **Code Structure & Organization**: File/folder organization, module separation, architecture.
2.  **Naming Conventions**: Clarity and consistency of variable, function, and class names.
3.  **Function & Class Design**: Single Responsibility Principle, length, complexity.
4.  **Code Complexity**: Cyclomatic complexity, nesting, long functions.
5.  **Documentation & Comments**: Quality and usefulness of code comments and docs.
6.  **Error Handling**: Consistency, proper exception usage, and recovery strategies.
7.  **Code Duplication**: Evidence of copy-paste programming and opportunities for abstraction.
8.  **Best Practices Compliance**: Adherence to language-specific best practices and SOLID principles.
9.  **Security Considerations**: Input validation, authentication, authorization, data protection.
10. **Performance & Efficiency**: Algorithm efficiency, resource usage, bottlenecks, scalability.
11. **Testing Strategy**: Test coverage, test quality, testability of code design.
12. **Accessibility & Usability**: UI/UX accessibility standards, user experience considerations.

**Quality Metrics:**
- Overall maintainability score (1-10)
- Security risk assessment (1-10)
- Performance efficiency rating (1-10)
- Test coverage percentage
- Areas needing immediate attention
- Long-term technical debt concerns

**Specific Recommendations:**
- Top 10 improvements with file references
- Security vulnerabilities to address
- Performance optimization opportunities
- Testing gaps to fill
- Refactoring priorities
- Code standards to establish`

### Step 2. Generate Code Analysis Report

Carefully review the Code Analysis, if you encounter multiple perspectives - synthesize together into a unified report, correct any formatting issues, remove the Main Directories (MAIN_DIRECTORIES), Coding Standards (CODING_STANDARDS), and Implementation Standards (IMPLEMENTATION_STANDARDS), and display in properly formatted **Markdown** report. Do not show any Todos/Task Lists, end with the report. Then **hard stop**.
"""
