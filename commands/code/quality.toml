# ---------------------------------------------------------------------------
# Command: /code:quality
#
# Description:
#   Calls the Gemini CLI to perform a comprehensive code quality analysis.
#
# Usage Examples:
#
#   1. Run a general analysis:
#      /code:quality
#
#   2. Focus the analysis on a specific area:
#      /code:quality focusing on naming conventions and code complexity
# ---------------------------------------------------------------------------

name = "code:quality"
description = "Comprehensive code quality analysis including maintainability, readability, and best practices"

prompt = """
# Prompt Name: Code Analysis
## Description: Analyze entire codebase architecture and structure using Gemini's large context window
## Version: 1.0
## Date: 2025-08-31
## Author: Sam Estrin

---

## Phase 1. Setup

### Step 1. Combined Directory Detection and Standards Scan

The **RESPONSE** is "`echo '# MAIN_DIRECTORIES'; gemini -p \"Find directories containing runtime code, excluding test directories, return only the directory basenames preceded by @ in a single line, separated by spaces\"; echo '# CODING_STANDARDS'; cat ./planning/specifications/sprint-coding-standards.md 2>/dev/null || echo 'No coding standards found'; echo '# IMPLEMENTATION_STANDARDS'; cat ./planning/specifications/implementation-standards.md 2>/dev/null || echo 'No implementation standards found - using default analysis approach'`"

### Step 2. Set Defaults

#### Default Implementation Strategy (Eskil Steenberg's Black Box Architecture)

**Black Box Design Principles:**
- Design modules that never need editing once written
- Create primitive-based interfaces that hide complexity
- Implement wrapper patterns for all external dependencies
- Build replaceable components with standardized interfaces
- Optimize for human cognitive load and maintainability

**Architecture Framework:**
1. **Primitive Identification**: Define core data types and operations
2. **Black Box Boundaries**: Create modules with single responsibility
3. **Dependency Wrapping**: Isolate external services behind interfaces
4. **Interface Design**: Hide implementation details, expose only essentials
5. **Replaceability Testing**: Verify components can be substituted

**Implementation Strategy:**
- Write code that works correctly from first deployment
- Build modular boundaries testable in isolation
- Create mock interfaces for external dependencies
- Implement comprehensive logging and state inspection
- Design validation modes for development and testing

**Quality Standards:**
- Test black box interfaces, not internal implementation
- Assess risk through dependency analysis and failure modes
- Maintain clear separation between platform and application logic
- Optimize for team scalability and developer velocity
- Ensure modules can be debugged and replaced independently

### Step 3. Extract from Response

Extract **MAIN_DIRECTORIES**, **CODING_STANDARDS**, and **IMPLEMENTATION_STANDARDS** from {RESPONSE}. If the **MAIN_DIRECTORIES** cannot be extracted, then set **MAIN_DIRECTORIES** to ".". If **CODING_STANDARDS** is "No coding standards found" then set **CODING_STANDARDS** to "Use general best practices". If {IMPLEMENTATION_STANDARDS} is "No implementation standards found - using default analysis approach" then set **IMPLEMENTATION_STANDARDS** to the **Default Implementation Strategy**.

## Phase 2. Code Analysis

You are an expert software architect/engineer.

### Code Quality Assessment
`gemini -p "{MAIN_DIRECTORIES} Perform a comprehensive code quality analysis. {{args}}

1.  **Code Structure & Organization**: File/folder organization, module separation, architecture.
2.  **Naming Conventions**: Clarity and consistency of variable, function, and class names.
3.  **Function & Class Design**: Single Responsibility Principle, length, complexity.
4.  **Code Complexity**: Cyclomatic complexity, nesting, long functions.
5.  **Documentation & Comments**: Quality and usefulness of code comments and docs.
6.  **Error Handling**: Consistency, proper exception usage, and recovery strategies.
7.  **Code Duplication**: Evidence of copy-paste programming and opportunities for abstraction.
8.  **Best Practices Compliance**: Adherence to language-specific best practices and SOLID principles.
9.  **Security Considerations**: Input validation, authentication, authorization, data protection.
10. **Performance & Efficiency**: Algorithm efficiency, resource usage, bottlenecks, scalability.
11. **Testing Strategy**: Test coverage, test quality, testability of code design.
12. **Accessibility & Usability**: UI/UX accessibility standards, user experience considerations.

**Quality Metrics:**
- Overall maintainability score (1-10)
- Security risk assessment (1-10)
- Performance efficiency rating (1-10)
- Test coverage percentage
- Areas needing immediate attention
- Long-term technical debt concerns

**Specific Recommendations:**
- Top 10 improvements with file references
- Security vulnerabilities to address
- Performance optimization opportunities
- Testing gaps to fill
- Refactoring priorities
- Code standards to establish`

---

Using ONLY the above technical output as context, provide a comprehensive code quality assessment in properly formatted **Markdown**. 

Then **hard stop**.
"""
