# ---------------------------------------------------------------------------
# Command: /code:analysis
#
# Description:
#   Calls the Gemini CLI to perform a high-level analysis of a codebase,
#   detailing its architecture, tech stack, and key components.
#
# Usage Examples:
#
#   1. Analyze the current directory:
#      /code:analysis
#
#   2. Analyze a specific directory:
#      /code:analysis analyzing the @server/api/ directory
# ---------------------------------------------------------------------------

name = "code:analysis"
description = "Analyze entire codebase architecture and structure using Gemini's large context window"

prompt = """
# Prompt Name: Code Analysis
## Description: Analyze entire codebase architecture and structure using Gemini's large context window
## Version: 1.0
## Date: 2025-08-31
## Author: Sam Estrin

---

## Phase 1. Setup

### Step 1. Set Operational Mode

**Check for --comprehensive flag in arguments:**
- If `--comprehensive` is present in {{args}}, **REPORT_TITLE** is "Comprehensive Code Analysis Report" and **INCLUDE_TECHNICAL** is "true"
- Otherwise **REPORT_TITLE** is "Code Analysis Report" and **INCLUDE_TECHNICAL** is "false"

Say "Generating the {REPORT_TITLE} ..."

### Step 2. Combined Directory Detection and Standards Scan

The **RESPONSE** is "`echo '# MAIN_DIRECTORIES'; gemini -p \"Find directories containing runtime code, excluding test directories, return only the directory basenames preceded by @ in a single line, separated by spaces\"; echo '# CODING_STANDARDS'; cat ./planning/specifications/sprint-coding-standards.md 2>/dev/null || echo 'No coding standards found'; echo '# IMPLEMENTATION_STANDARDS'; cat ./planning/specifications/implementation-standards.md 2>/dev/null || echo 'No implementation standards found - using default analysis approach'`"

### Step 3. Set Defaults

#### Default Implementation Strategy (Eskil Steenberg's Black Box Architecture)

**Black Box Design Principles:**
- Design modules that never need editing once written
- Create primitive-based interfaces that hide complexity
- Implement wrapper patterns for all external dependencies
- Build replaceable components with standardized interfaces
- Optimize for human cognitive load and maintainability

**Architecture Framework:**
1. **Primitive Identification**: Define core data types and operations
2. **Black Box Boundaries**: Create modules with single responsibility
3. **Dependency Wrapping**: Isolate external services behind interfaces
4. **Interface Design**: Hide implementation details, expose only essentials
5. **Replaceability Testing**: Verify components can be substituted

**Implementation Strategy:**
- Write code that works correctly from first deployment
- Build modular boundaries testable in isolation
- Create mock interfaces for external dependencies
- Implement comprehensive logging and state inspection
- Design validation modes for development and testing

**Quality Standards:**
- Test black box interfaces, not internal implementation
- Assess risk through dependency analysis and failure modes
- Maintain clear separation between platform and application logic
- Optimize for team scalability and developer velocity
- Ensure modules can be debugged and replaced independently

### Step 4. Extract from Response

Extract **MAIN_DIRECTORIES**, **CODING_STANDARDS**, and **IMPLEMENTATION_STANDARDS** from {RESPONSE}. If the **MAIN_DIRECTORIES** cannot be extracted, then set **MAIN_DIRECTORIES** to ".". If **CODING_STANDARDS** is "No coding standards found" then set **CODING_STANDARDS** to "Use general best practices". If {IMPLEMENTATION_STANDARDS} is "No implementation standards found - using default analysis approach" then set **IMPLEMENTATION_STANDARDS** to the **Default Implementation Strategy**.

## Phase 2. Code Analysis

### Step 1. Generate Code Analysis

You are an expert technical consultant providing professional code assessments. You **cannot** install any new tools, you must work with what is available. You **can** suggest the user installs and runs 3rd party tools if applicable.

#### Code Analysis
`gemini -p "{MAIN_DIRECTORIES} You are a team of technical experts working together - a software architect, senior developer, and technical lead. Each team member must provide their individual analysis from their expertise perspective, then work together to create a comprehensive code analysis that leverages all of your inputs into a single unified report. {{args}}

1. **Project Overview**: Purpose, domain, target users, business context.
2. **Architecture & Design Patterns**: High-level architecture, design patterns used, architectural decisions.
3. **Technology Stack**: Languages, frameworks, libraries, databases, external services.
4. **File & Module Structure**: Directory organization, module relationships, entry points.
5. **Code Quality**: Readability, maintainability, consistency, documentation coverage.
6. **Performance Considerations**: Bottlenecks, optimization opportunities, scalability concerns.
7. **Testing Strategy**: Test coverage, testing frameworks, test quality and organization.
8. **Security Assessment**: Security practices, potential vulnerabilities, authentication/authorization.
9. **Configuration & Environment**: Environment setup, configuration management, deployment considerations.
10. **Dependencies & Package Management**: Dependency analysis, version management, security of dependencies.
11. **Areas for Improvement**: Technical debt, refactoring opportunities, modernization suggestions.
12. **Development Workflow**: Build process, CI/CD, development tools, code standards.

**For each area, provide:**
- ✅ Strengths and well-implemented aspects.
- ⚠️ Areas of concern or potential issues.
- 💡 Specific recommendations for improvement.
- 📁 Relevant files and code examples.
- 🎯 Priority level for addressing issues (High/Medium/Low).`

### Step 2. Set Template

#### Professional Technical Assessment Template

##### Executive Summary
- Project overview and technical maturity assessment
- Key architectural strengths and concerns
- Overall code quality and maintainability rating
- Critical recommendations requiring immediate attention

##### Technical Architecture
**Architecture Overview**
- System design and architectural patterns
- Technology stack evaluation
- Scalability and performance characteristics

**Design Quality**
- Code organization and modularity
- Design pattern implementation
- Separation of concerns

##### Code Quality Assessment
**Strengths**
- Well-implemented features and practices
- Code quality highlights

**Areas for Improvement**
- Technical debt identification
- Code quality concerns
- Maintainability issues

##### Risk Assessment
**High Priority Issues** (Immediate Attention)
- Critical technical risks
- Performance bottlenecks
- Security concerns

**Medium Priority Issues** (Next Sprint/Quarter)
- Moderate technical debt
- Optimization opportunities

**Low Priority Issues** (Future Considerations)
- Minor improvements
- Enhancement opportunities

##### Technology & Dependencies
- Technology stack assessment
- Dependency analysis and recommendations
- Upgrade and modernization opportunities

##### Development Process
- Testing strategy evaluation
- CI/CD and deployment assessment
- Development workflow recommendations

##### Recommendations
- Prioritized action plan
- Resource requirements
- Implementation roadmap
- Success metrics

##### Technical Analysis _(only included with --comprehensive flag)_
- Detailed Technical Findings
- Code References (path/to/filenames, function names, line numbers)
- Implementation Details
- Architecture Diagrams and Technical Specifications

### Step 3. Generate {REPORT_TITLE}

Carefully review the Code Analysis, and display a single, properly formatted **Markdown** report using the **Professional Technical Assessment Template**.

**Important formatting rules:**
- If {INCLUDE_TECHNICAL} is "true", include the "##### Technical Analysis" section with detailed technical findings, code references, and implementation details
- If {INCLUDE_TECHNICAL} is "false", completely omit the "##### Technical Analysis" section and its content
- Use the {REPORT_TITLE} as the main heading
- Do not show any Todos/Task Lists, end with the report. Then **hard stop**.

"""

