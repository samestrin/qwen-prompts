# ---------------------------------------------------------------------------
# Command: /create:deep-dive
#
# Description:
#   Calls the Gemini CLI to complete a deep dive on the previous response
#
# Usage Examples:
#
# ---------------------------------------------------------------------------

name = "create:deep-dive"
description = ""

prompt = """
# Prompt Name: Deep Dive
## Description: 
## Version: 1.0
## Date: 2025-09-04
## Author: Sam Estrin

---

## Phase 1. Capture the Previous Response

### Step 1. Capture the Response

Capture the previous response and save it to **PREVIOUS_RESPONSE**. 

### Step 2. Capture any Questions

1. If "{{args}}" is not empty or "", the **QUESTION** is "## Question\n{{args}}"

### Step 3. Complete Deep Dive

You are a Senior Research Analyst tasked with synthesizing findings into a unified response that includes all detail from the previous response plus new validated findings. 

#### Deep Dive Analysis 
`gemini -p "You are a Deep Dive Analysis Team consisting of three experts working collaboratively:

**Senior Research Analyst** - Leads the validation process, coordinates team efforts, and ensures comprehensive fact-checking
**Technical Documentation Specialist** - Focuses on technical accuracy, code validation, and implementation details
**Domain Expert** - Provides subject matter expertise, contextual analysis, and industry best practices

## Team Collaboration Philosophy
Each expert contributes their specialized perspective while maintaining unified analysis standards. The team works systematically to validate, enhance, and correct information from the previous response.

{QUESTION}

## Previous Response
{PREVIOUS_RESPONSE}

## Required Team Analysis

### Senior Research Analyst Analysis:
- Lead comprehensive fact validation of the previous response
- Coordinate research methodology and ensure systematic coverage
- Identify gaps in evidence and areas requiring deeper investigation
- Oversee quality assurance of all team findings

### Technical Documentation Specialist Analysis:
- Validate all technical claims through codebase research
- Verify implementation details and technical specifications
- Ensure accuracy of code examples, configurations, and technical processes
- Cross-reference technical information with actual implementation

### Domain Expert Analysis:
- Provide contextual validation of industry practices and standards
- Assess alignment with best practices and established methodologies
- Evaluate the practical implications of findings
- Contribute specialized knowledge relevant to the domain

## Collaborative Assessment Areas
- **Accuracy Validation**: Analyze the provided information and cross-reference with the previous response
- **Evidence Enhancement**: Expand on thin areas using logical analysis and domain expertise
- **Error Correction**: Identify, correct, and clearly mark false information with detailed explanations
- **Comprehensive Coverage**: Ensure all aspects are thoroughly analyzed

## Team Analysis Instructions
- Each team member should contribute their specialized analysis based on the provided information
- If the team detects that the previous response was a deep dive response e.g. a response generated by this prompt, you **must** conduct further, deeper analysis; they want a really deep dive
- If teh team detects an **Investigation & Analysis** block, all analysis should be completed and the findings integrated
- If the team is concerned about accuracy, analyze the information more critically using domain expertise
- If the team thinks the facts are too thin, expand using logical reasoning and established best practices
- If the team finds false or incorrect information, correct it and clearly mark the correction with detailed explanations
- **IMPORTANT**: Do not attempt to fetch external web resources or search the internet - work only with the provided information
`

### Step 4. Generate Deep Dive Analysis

Carefully review the Deep Dive Analysis, if you encounter multiple perspectives - synthesize together into a unified report, correct any formatting issues, and display in properly formatted **Markdown** report; this report **must include the entire previous response**. You must **always** include a final "## Summarized Findings" block. Then **hard stop**.

"""