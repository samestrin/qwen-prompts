# ---------------------------------------------------------------------------
# Command: /create:sprint
#
# Description:
#   Analyzes a feature request and the project context to generate a
#   detailed and actionable sprint plan.
#
# Usage Example:
#
#   1. Plan a new feature sprint:
#      /create:sprint Implement user authentication with JWT
# ---------------------------------------------------------------------------

name = "create:sprint"
description = "Create detailed sprint plans based from plans, specifications, user input and more"

prompt = """
# Prompt Name: Create Sprint
## Description: Create detailed sprint plans based from plans, specifications, user input and more
## Version: 1.3
## Date: 2025-09-04
## Author: Sam Estrin

---

## Phase 1: Pre-Analysis

### Step 1. Quick Setup

**Set mode based on "{{args}}":**

1. CLEAN_ARGS (string) is "{{args}}"
2. if "{CLEAN_ARGS}" contains "--comprehensive":
   - Set **ADDITIONAL_FILE_DETAIL** to "Files Affected:\n   - Path/To/Filename\n   - Function Names\n   - Line Numbers"
   - Set **COMPREHENSIVE** is "true"
   - Set **SPRINT_TITLE_PREFIX** is "Comprehensive Sprint Plan"
   - Set **EXCLUDE_TESTS** is ""
   - Remove "--comprehensive" from {CLEAN_ARGS}
   else:
   - Set **ADDITIONAL_FILE_DETAIL** to "Number of files/components affected"
   - Set **COMPREHENSIVE** is "false"
   - Set **SPRINT_TITLE_PREFIX** is "Sprint Plan"
   - Set **EXCLUDE_TESTS** is "- excluding test directories -"
3. if "{CLEAN_ARGS}" contains "--include-tests":
   - Set **EXCLUDE_TESTS** is ""
   - Remove "--include-tests" from {CLEAN_ARGS}

### Step 2. Combined Sprint Number/Coding Strategy/Branch Strategy/Date/Main Directory Scan

The **RESPONSE** is "`echo '# CURRENT_HIGHEST_SPRINT'; find ./planning/sprints/{active,completed} -type d -name "[0-9]*" -exec basename {} \\; 2>/dev/null | sed 's/_.*$//' | grep -E '^[0-9]+(\\.[0-9]+)*$' | sort -V | tail -1; echo '# CODING_STANDARDS'; cat ./planning/specifications/sprint-coding-standards.md 2>/dev/null || echo 'No coding standards strategy found'; echo '# BRANCH_STRAT'; cat ./planning/specifications/sprint-branching-strategy.md 2>/dev/null || echo 'No branch strategy found'; echo '# TODAYS_DATE'; date '+%B %d, %Y %I:%M:%S%p'; echo '# MAIN_DIRECTORIES'; gemini -p \"Find directories containing runtime code {EXCLUDE_TESTS} return only the directory basenames preceded by @ in a single line, separated by spaces\""`".

#### Default Git Branch Strategy

**Branch Management:**
- Create branch: `git checkout -b {BRANCH_TYPE}/{BRANCH_NAME}`
- Commit frequently with descriptive messages following conventional commit format
- Each phase should have its own commit(s)
- Final merge to main after all phases complete and tests pass

**Commit Message Format:**
```
<type>(<scope>): <brief summary>

<detailed description>

- Specific change 1
- Specific change 2
```

#### Default Coding Standards (Eskil Steenberg's Black Box Architecture)

**Architectural Principles:**
- **Black Box Design**: Each module should be completely replaceable using only its interface
- **Primitive-First**: Identify and work with the fundamental data types that flow through your system
- **Wrap External Dependencies**: Never depend directly on code you don't control - always wrap it
- **Optimize for Human Understanding**: Code should be readable by any developer, not just the author
- **Future-Proof Modularity**: Design for 10x growth in features, users, and developers

**Code Standards:**
- **TDD Approach**: Use TDD for all {IMPLEMENTATION_TYPE} and new implementations
- **Coding Style**: Follow {LANGUAGE} Standard Style and project naming conventions
- **Function Length**: 50-100 lines max (optimize for cognitive load)
- **File Length**: 500-650 lines max (one developer should understand the entire file)
- **Cognitive Complexity**: Keep logic simple and clear - avoid clever code
- **DRY & KISS**: Avoid over-engineering and unneeded complexity
- **Interface Clarity**: Public APIs should be clean, documented, and stable
- **State Isolation**: Modules should not share mutable state

### Step 3. Extract from Response

Extract **CURRENT_HIGHEST_SPRINT**, **CODING_STANDARDS**, **BRANCH_STRAT**, **TODAYS_DATE** and **MAIN_DIRECTORIES** from {RESPONSE}. If the **MAIN_DIRECTORIES** does can not be extracted, then set **MAIN_DIRECTORIES** to ".". If {BRANCH_STRAT} is "No branch strategy found" then set **BRANCH_STRAT** to the **Default Git Branch Strategy". If {CODING_STANDARDS} is "No coding standards strategy found" then set **CODING_STANDARDS** to the **Default Coding Standards**. 

## Phase 2: Sprint Creation

### Step 1. Pre-Analysis

You are an expert software architect and project manager creating a **sprint plan** for:
 
**{CLEANED_ARGS}** 
 
You are ONLY in planning mode - do **NOT** write code, create files, create directories, or start implementation. You are ONLY authoring a sprint plan document. After generating the sprint plan, you will **hard stop** and wait for further instructions. Again, do not make any code changes.

### Step 2. Architectural Analysis

Conduct a _silent analysis by running the following command and capturing it, without displaying it to the user. It will be processed.

#### Architectural Analysis (Silent)
`echo "# Architectural Analysis"; gemini -p "{MAIN_DIRECTORIES} You are working as a cross-functional sprint planning team with three expert perspectives collaborating to create comprehensive, actionable sprint plans.

## Team Composition & Roles

**Technical Lead/Senior Developer:**
- Focus: Implementation feasibility, code architecture, and development best practices
- Responsibilities: Assess technical complexity, identify implementation patterns, estimate development effort
- Expertise: Hands-on coding experience, architectural decision-making, team mentoring

**DevOps/Platform Engineer:**
- Focus: Deployment, infrastructure, CI/CD, and operational concerns  
- Responsibilities: Evaluate deployment complexity, infrastructure requirements, testing strategies
- Expertise: Build systems, containerization, monitoring, scalability planning

**Product/Project Manager:**
- Focus: Sprint planning methodology, timeline management, and deliverable prioritization
- Responsibilities: Break down features into actionable phases, manage dependencies, risk assessment
- Expertise: Agile methodologies, stakeholder management, delivery optimization

## Team Collaboration Philosophy
Your team specializes in creating sprint plans that balance architectural excellence with delivery reality. You combine black box design principles for building large-scale systems that last decades with practical sprint execution knowledge.

## Core Philosophy
**\"It's faster to write five lines of code today than to write one line today and then have to edit it in the future.\"**

Your goal is to create software that:
- Maintains constant developer velocity regardless of project size
- Can be understood and maintained by any developer
- Has modules that can be completely replaced without breaking the system
- Optimizes for human cognitive load, not code cleverness

## Implementation Requested: 
**\"{CLEANED_ARGS}\"**

Perform ANALYSIS ONLY - do NOT create files, directories, or make changes. Each team member contributes their expertise to create a unified comprehensive analysis that **must** include:

## Required Team Analysis

**Technical Lead Analysis:**
- Implementation complexity assessment and development approach
- Code architecture patterns and technical feasibility
- Development effort estimation and team capacity planning

**DevOps Engineer Analysis:**
- Infrastructure and deployment requirements
- CI/CD pipeline considerations and testing strategies
- Scalability and operational monitoring needs

**Product Manager Analysis:**
- Sprint structure and phase breakdown optimization
- Timeline management and dependency coordination
- Risk assessment and mitigation strategies

## Collaborative Assessment Areas

Working together, your team analysis **must** include:

1. **Primitive Identification**: 
   - What are the core \"primitives\" - the fundamental data types that flow through this system?
   - What operations are performed on this data?
   - How can you generalize to handle future requirements?
   - Examples: Unix files, graphics polygons, healthcare events, user sessions

2. **Black Box Boundary Design**:
   - Where should the black box boundaries be drawn?
   - What should be exposed vs. hidden in module interfaces?
   - Can each module be completely rewritten using only its interface?
   - What are the clean, documented APIs between components?

3. **Complexity Assessment**: Identify if this is a simple (1-3 days), moderate (4-7 days), or complex (8+ days) implementation based on:
   {ADDITIONAL_FILE_DETAIL}   
   - Integration complexity with existing systems
   - New dependencies or architectural changes required
   - Testing complexity and scope
   - **Cognitive load**: Can one developer understand and maintain each module?

4. **Modular Architecture Analysis**: 
   - Examine existing codebase for modular boundaries and patterns
   - Identify single responsibility violations and coupling issues
   - Assess if modules can be replaced without breaking others
   - Analyze configuration variables, APIs, and integration points
   - Consider threading, async, or concurrency from a modular perspective

5. **Dependency Architecture**:
   - Map internal dependencies (existing modules, classes, functions)
   - Identify external dependencies that need wrapping/abstraction
   - Assess version compatibility and integration requirements
   - **Wrap external dependencies**: Never depend directly on code you don't control

6. **Implementation Strategy with Replaceability**:
   - Break down into logical phases with realistic time estimates
   - Design for replaceability: any module should be rewritable from scratch
   - Identify which files need creation vs modification
   - Specify testing strategy focusing on interface validation
   - Consider error handling, validation, and edge cases at module boundaries

7. **Future-Proof Architecture**:
   - Will this work with 10x more features/users/developers?
   - Can new developers contribute immediately?
   - What if key technologies become obsolete?
   - How will this be maintained in 5 years?

Always ask: **What are the primitives? Where are the black box boundaries? Is this replaceable? Does this optimize for human understanding? Are responsibilities clear?**

Be thorough and specific. Focus on creating systems that will still be understandable and modifiable years from now, by different developers, using potentially different technologies."`

### Step 3. Sprint Plan Creation

Now, using the comprehensive analysis above, create a detailed sprint plan. **CRITICAL**: You MUST generate the appropriate number of phases based on the complexity assessment:

**FILE ORGANIZATION RULE**:

**CRITICAL**: All files created during sprint execution MUST be organized within the sprint folder structure:
- **Main sprint document**: `/planning/sprints/active/{SPRINT_NUMBER}_{FEATURE_NAME}/README.md`
- **Research files**: `/planning/sprints/active/{SPRINT_NUMBER}_{FEATURE_NAME}/research/`
- **Notes and documentation**: `/planning/sprints/active/{SPRINT_NUMBER}_{FEATURE_NAME}/notes/`
- **Code artifacts and prototypes**: `/planning/sprints/active/{SPRINT_NUMBER}_{FEATURE_NAME}/artifacts/`
- **Any additional files**: Must be nested within the sprint folder, NOT in the project root

This ensures clean organization and prevents cluttering the main project directory.

**PHASE GENERATION RULES**:

The following are estimates that show reasonable phase lengths based on project complexity. **Documentation is ALWAYS required** as a final phase.

- **SIMPLE features (1-3 days)**: Generate around 3-4 phases
  - Focus on: Setup → Implementation → Testing → Documentation
- **MODERATE features (4-7 days)**: Generate around 4-5 phases  
  - Focus on: Setup → Core Implementation → Integration/Testing → Documentation → (Final Review if needed)
- **COMPLEX features (8+ days)**: Generate around 6-8 phases
  - Focus on: Architecture → Core Components → Integration → Advanced Features → Testing → Performance Optimization → Documentation → Final Integration

**DO NOT default to 4 phases**. The number of phases must match the complexity level you identified.

**Key Requirements**:
1. **Dynamic Phase Count**: Generate the exact number of phases appropriate for the complexity level
2. **Reflect Complexity**: Match the sprint structure to the complexity identified in analysis
3. **Technical Depth**: Include specific technical challenges, architectural decisions, and implementation patterns
4. **Realistic Timelines**: Provide time estimates based on complexity assessment
5. **Comprehensive Scope**: Address all aspects identified in the analysis (threading, configuration, packaging, etc.)
6. **Risk Mitigation**: Include specific risks and mitigation strategies from the analysis

Preserve the markdown structure, including instructional text and checkboxes `[ ]`. Use the phase structure template provided below to generate the appropriate number of phases.

