### Step 4. Determined the Correct Sprint Number and Filename

**Determine the Filename Based on the Current Highest Sprint**

Before creating the sprint plan, determine the next sprint number by checking existing files:

Based on this number:
- If no sprints exist (empty result): start with sprint 1.0
- For new major sprints: increment the base number (e.g., if highest is 2.3, next major is 3.0)
- For sprint updates: increment the decimal (e.g., if highest is 2.3, next update is 2.4)

**DETERMINED_FILENAME** is "@planning/sprints/active/{CURRENT_HIGHEST_SPRINT+1}.0_<feature_name>/README.md". _Sprint folder names must always use the .0 format (e.g., 7.0_feature/, not 6.1_feature/) - increment the major number only, never use decimal increments. The folder structure will include research/, notes/, and artifacts/ subdirectories._

### Step 5. Save the Sprint

Create the sprint folder structure and output the sprint plan content in **Markdown** into {DETERMINED_FILENAME}. The folder structure should include:
- README.md (main sprint plan)
- research/ (for research findings)
- notes/ (for meeting notes and documentation)
- artifacts/ (for generated files and outputs)

Double-check exists {DETERMINED_FILENAME}; if it doesn't attempt a second write. Then **hard stop**.
