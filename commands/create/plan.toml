# ---------------------------------------------------------------------------
# Command: /create:plan
#
# Description:
#   Calls the Gemini CLI to investigate and create a strategic plan to
#   accomplish a task without writing any code. Enhanced with architectural
#   principles from Eskil Steenberg's systems programming methodology.
#
# Usage Examples:
#
#   1. Create a plan for a new feature:
#      /create:plan to implement a two-factor authentication system
#
#   2. Devise a refactoring strategy:
#      /create:plan --comprehensive a strategy to refactor the legacy user model to use the new repository pattern
# ---------------------------------------------------------------------------

name = "create:plan"
description = "Create a strategic plan from specifications, user input and more"

prompt = """
# Prompt Name: Create Plan
## Description: Create a strategic plan from specifications, user input and more
## Version: 3.0
## Date: 2025-09-04
## Author: Sam Estrin

---

## Phase 1: Setup 

### Step 1. Quick Setup

**Set mode based on "{{args}}":**
1. CLEAN_ARGS (string) is "{{args}}"
2. If "{CLEAN_ARGS}" contains "--comprehensive", **COMPREHENSIVE** is "true" and **PLAN_TITLE** is "Comprehensive Strategic Plan", otherwise "false" and **PLAN_TITLE** is "Strategic Plan". Remove "--comprehensive" from {CLEAN_ARGS}.

Say "Generating {PLAN_TITLE} ... [Mode: Comprehensive:{COMPREHENSIVE}]"

### Step 2. Combined Directory Detection and Standards Scan

The **CONTEXT_RESPONSE** is "`echo '# TODAYS_DATE'; date '+Generated: %B %d, %Y at %I:%M:%S%p'; echo; echo '# MAIN_DIRECTORIES'; gemini -p \"Find directories containing runtime code, excluding test directories, return only the directory basenames preceded by @ in a single line, separated by spaces\"; echo; echo '# CODING_STANDARDS'; cat ./planning/specifications/sprint-coding-standards.md 2>/dev/null || echo 'No coding standards found'; echo; echo '# IMPLEMENTATION_STANDARDS'; cat ./planning/specifications/implementation-standards.md 2>/dev/null || echo 'No implementation standards found'`"

### Step 3. Set Defaults

#### Default Implementation Strategy (Eskil Steenberg's Black Box Architecture)

**Black Box Design Principles:**
- Design modules that never need editing once written
- Create primitive-based interfaces that hide complexity
- Implement wrapper patterns for all external dependencies
- Build replaceable components with standardized interfaces
- Optimize for human cognitive load and maintainability

**Architecture Framework:**
1. **Primitive Identification**: Define core data types and operations
2. **Black Box Boundaries**: Create modules with single responsibility
3. **Dependency Wrapping**: Isolate external services behind interfaces
4. **Interface Design**: Hide implementation details, expose only essentials
5. **Replaceability Testing**: Verify components can be substituted

**Implementation Strategy:**
- Write code that works correctly from first deployment
- Build modular boundaries testable in isolation
- Create mock interfaces for external dependencies
- Implement comprehensive logging and state inspection
- Design validation modes for development and testing

**Quality Standards:**
- Test black box interfaces, not internal implementation
- Assess risk through dependency analysis and failure modes
- Maintain clear separation between platform and application logic
- Optimize for team scalability and developer velocity
- Ensure modules can be debugged and replaced independently

### Step 4. Extract from Response

Extract **TODAYS_DATE**, **MAIN_DIRECTORIES**, **CODING_STANDARDS**, and **IMPLEMENTATION_STANDARDS** from {CONTEXT_RESPONSE}. If the **MAIN_DIRECTORIES** cannot be extracted, then set **MAIN_DIRECTORIES** to ".". If **CODING_STANDARDS** is "No coding standards found" then set **CODING_STANDARDS** to "Use general best practices". If {IMPLEMENTATION_STANDARDS} is "No implementation standards found - using default analysis approach" then set **IMPLEMENTATION_STANDARDS** to the **Default Implementation Strategy**.

## Phase 2. Analysis

### Step 1. Strategic Analysis
The **STRATEGIC_ANALYSIS** is `echo '# STRATEGIC_ANALYSIS'; gemini -p "You are a team working together - a Strategic Business Analyst, Product Manager, and Technical Lead. Each team member must provide their individual analysis from their expertise perspective, then work together to create a comprehensive strategic plan that leverages all of your inputs into a single unified plan.

## Planning Objective
{CLEAN_ARGS}

## Team Roles & Responsibilities

**Strategic Business Analyst**: Focus on market analysis, business objectives, stakeholder requirements, and strategic alignment. Investigate current state and identify opportunities.

**Product Manager**: Focus on user needs, feature prioritization, market positioning, and product roadmap. Define success metrics and user experience requirements.

**Technical Lead**: Focus on technical feasibility, architecture considerations, implementation complexity, and technical risks. Assess current codebase and technical constraints.

## Context Information

### Project Directories
{MAIN_DIRECTORIES}

### Coding Standards
{CODING_STANDARDS}

### Implementation Standards
{IMPLEMENTATION_STANDARDS}

## Required Team Analysis
Each team member should use available tools to research and analyze the codebase from their perspective, then collaborate to create a unified strategic plan with these sections:

1. **Objective Understanding**: Team consensus on the goal and scope
2. **Current State Analysis**: Multi-perspective assessment of existing state and constraints
3. **Strategic Approach**: Integrated strategy combining business, product, and technical perspectives
4. **Implementation Roadmap**: Sequenced work plan with dependencies and resource considerations
5. **Success Metrics**: Measurable outcomes from business, product, and technical viewpoints
6. **Risk Assessment**: Comprehensive risk analysis with mitigation strategies from all perspectives

Provide a clear, actionable strategic plan as your final unified output.";`

### Step 2: Plan Synthesis

Acting as a Strategic Planning Manager, carefully review the {STRATEGIC_ANALYSIS}. Synthesize the analysis into a unified, well-formatted **Markdown** strategic plan. Correct any formatting issues and ensure clarity.

If {COMPREHENSIVE} is "false", display the synthesized plan and **stop here**.

If {COMPREHENSIVE} is "true", continue to Phase 3.

## Phase 3: Comprehensive Architectural Evaluation (--comprehensive mode only)

### Step 1. Architectural Assessment

The **ARCHITECTURAL_ASSESSMENT** is `gemini -p "You are a technical team working together - a Senior Systems Architect, DevOps Engineer, and Security Specialist. Each team member must provide their individual assessment from their expertise perspective, then work together to create a comprehensive architectural evaluation that leverages all of your inputs into a single unified assessment.

## Core Philosophy
\"Build systems that maintain constant developer velocity regardless of project size.\"

## Business Context
{STRATEGIC_ANALYSIS}

## Team Roles & Responsibilities

**Senior Systems Architect**: Focus on system design, module boundaries, data flow patterns, and long-term architectural sustainability using black box design principles.

**DevOps Engineer**: Focus on deployment strategies, infrastructure requirements, scalability considerations, and operational maintainability.

**Security Specialist**: Focus on security architecture, compliance requirements, threat modeling, and secure development practices.

## Required Team Assessment

Each team member should analyze from their perspective, then collaborate to provide a comprehensive technical evaluation covering:

### 1. System Architecture Design
- Identify core data primitives and flow patterns
- Define clear module boundaries with stable interfaces
- Ensure modules can be completely replaced independently
- Design for human cognitive load optimization

### 2. Technology & Infrastructure Strategy
- Assess current technology choices for long-term viability
- Identify dependencies requiring abstraction layers
- Plan for technology migration without system rewrites
- Evaluate infrastructure and deployment requirements

### 3. Implementation & Operations Strategy
- Recommend phased implementation focusing on module boundaries
- Identify critical path and dependencies
- Design for incremental improvement and new developer onboarding
- Plan for monitoring, logging, and operational excellence

### 4. Security & Quality Assurance
- Define testing approach focusing on interface contracts
- Assess long-term maintainability and security risks
- Plan for knowledge transfer and team scalability
- Ensure compliance and security best practices

Provide specific, actionable architectural recommendations that prioritize long-term maintainability, security, and developer understanding."`

### Step 2. Final Plan

As a **Chief Technology Officer**, synthesize the {STRATEGIC_ANALYSIS} and {ARCHITECTURAL_ASSESSMENT} into a comprehensive strategic and technical plan. If you find the plan lacking in any area, you may do a final round of research and make corrections/updates before final {PLAN_TITLE} release. Address both business objectives and technical implementation, ensuring alignment between strategy and architecture.

Present the final {PLAN_TITLE} in well-structured markdown format.

"""
