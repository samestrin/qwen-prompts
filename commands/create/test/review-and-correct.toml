### Step 3. Set Defaults

#### Default Coding Standards (Eskil Steenberg's Black Box Architecture)

**Architectural Principles:**
- **Black Box Design**: Each module should be completely replaceable using only its interface
- **Primitive-First**: Identify and work with the fundamental data types that flow through your system
- **Wrap External Dependencies**: Never depend directly on code you don't control - always wrap it
- **Optimize for Human Understanding**: Code should be readable by any developer, not just the author
- **Future-Proof Modularity**: Design for 10x growth in features, users, and developers

**Code Standards:**
- **TDD Approach**: Use TDD for all {IMPLEMENTATION_TYPE} and new implementations
- **Coding Style**: Follow {LANGUAGE} Standard Style and project naming conventions
- **Function Length**: 50-100 lines max (optimize for cognitive load)
- **File Length**: 500-650 lines max (one developer should understand the entire file)
- **Cognitive Complexity**: Keep logic simple and clear - avoid clever code
- **DRY & KISS**: Avoid over-engineering and unneeded complexity
- **Interface Clarity**: Public APIs should be clean, documented, and stable
- **State Isolation**: Modules should not share mutable state

#### Default Testing Standards

**Testing Philosophy:**
- **Test-Driven Development (TDD)**: Write tests before implementation for new features
- **Black Box Testing**: Test interfaces and behavior, not internal implementation
- **Test Pyramid**: Unit tests (70%), Integration tests (20%), E2E tests (10%)
- **Fast Feedback**: Tests should run quickly and provide immediate feedback
- **Deterministic Tests**: Tests must be reliable and produce consistent results
- **Independent Tests**: Each test should be isolated and not depend on others

**Test Standards:**
- **Coverage Target**: Minimum 80% code coverage for critical paths
- **Test Naming**: Use descriptive names that explain what is being tested
- **Arrange-Act-Assert**: Structure tests with clear setup, execution, and verification
- **One Assertion Per Test**: Focus each test on a single behavior or outcome
- **Mock External Dependencies**: Isolate units under test from external systems
- **Test Data Management**: Use factories or fixtures for consistent test data
- **Error Case Testing**: Test both happy path and error scenarios
- **Performance Testing**: Include tests for critical performance requirements

**Test Organization:**
- **Mirror Source Structure**: Test directory structure should mirror source code
- **Test File Naming**: Use consistent naming conventions (e.g., `test_*.py`, `*.test.js`)
- **Test Categories**: Separate unit, integration, and end-to-end tests
- **Shared Utilities**: Create reusable test helpers and utilities
- **CI/CD Integration**: All tests must pass before code can be merged

### Step 4. Extract from Response

Extract **CURRENT_HIGHEST_SPRINT**, **CODING_STANDARDS**, **TESTING_STANDARDS**, **TODAYS_DATE** and **TEST_DIRECTORIES** from {RESPONSE}. If the **TEST_DIRECTORIES** does can not be extracted, then set **TEST_DIRECTORIES** to ".". If {TESTING_STANDARDS} is "No testing strategy found" then set **TESTING_STANDARDS** to the **Default Testing Strategy**. If {CODING_STANDARDS} is "No coding standards strategy found" then set **CODING_STANDARDS** to the **Default Coding Standards**. 

