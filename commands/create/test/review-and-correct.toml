### Step 7. Dynamic Review and Correct Document Generation

Using the platform detection and test analysis above, create a comprehensive Review and Correct document with **DYNAMIC PHASE GENERATION** based on test suite complexity. Calculate the next sprint number by adding 0.1 to the current highest sprint number (if {CURRENT_HIGHEST_SPRINT} is empty, start with 1.0).

The **DETERMINED_SPRINT_NUMBER** is {CURRENT_HIGHEST_SPRINT} + 0.1 (or 1.0 if no existing sprints)

The **BASENAME** is the basename of {TARGETS} after removing the preceeding "@"

The **DETERMINED_FILENAME** is "planning/sprints/active/{DETERMINED_SPRINT_NUMBER}_review_and_correct_{BASENAME}.md"

**CRITICAL**: You MUST generate the appropriate number of phases based on the test suite complexity assessment:

**PHASE GENERATION RULES FOR TEST RESOLUTION**:

- **SIMPLE test suites (1-5 failing tests, basic issues)**: Generate 3-4 phases
  - Focus on: Environment Setup → Test Resolution → Validation → Documentation
- **MODERATE test suites (6-15 failing tests, integration issues)**: Generate 4-5 phases  
  - Focus on: Environment Setup → Core Test Resolution → Integration Fixes → Validation → Documentation
- **COMPLEX test suites (16+ failing tests, systemic issues)**: Generate 6-8 phases
  - Focus on: Environment Analysis → Core Infrastructure → Individual Test Resolution → Integration Fixes → Performance Validation → System Testing → Documentation → Final Integration

**DO NOT default to fixed phases**. The number of phases must match the complexity level identified in your analysis.

**Key Requirements**:
1. **Dynamic Phase Count**: Generate the exact number of phases appropriate for the test complexity level
2. **Reflect Test Complexity**: Match the resolution structure to the test issues identified
3. **Technical Depth**: Include specific test challenges, platform issues, and resolution patterns
4. **Realistic Timelines**: Provide time estimates based on test complexity assessment
5. **Comprehensive Scope**: Address all aspects identified in the analysis (environment, dependencies, individual tests, etc.)
6. **Risk Mitigation**: Include specific test risks and mitigation strategies from the analysis

**ADAPTIVE PHASE NAMING**: Choose phase names that reflect the specific test suite type:

**For Unit Test Suites:**
- "Environment & Dependencies", "Core Unit Test Resolution", "Mock & Stub Fixes", "Validation & Coverage"

**For Integration Test Suites:**
- "Service Setup & Configuration", "Database & External Dependencies", "API Integration Fixes", "End-to-End Validation"

