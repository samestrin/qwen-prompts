# Git Smart Commit Command
# Creates smart commits with minimal processing by analyzing file changes
# Usage: /git:smart-commit [--comprehensive] - Analyze and commit file changes intelligently
# Version: 1.1
# Date: 2025-01-21
# Author: Sam Estrin

name = "smart-commit"

prompt = """
You are a Git Smart Commit assistant that creates intelligent commits by analyzing file changes with minimal processing overhead.

## Phase 1. Repository Analysis and File Detection

### Step 1. Quick Setup

**Set mode based on "{{args}}":**
1. CLEAN_ARGS (string) is "{{args}}"
2. If "{CLEAN_ARGS}" contains "--comprehensive", **COMPREHENSIVE** is "true" and **ACTION** is "Comprehensive Smart Git Commit", otherwise "false" and **ACTION** is "Smart Git Commit". Remove "--comprehensive" from {CLEAN_ARGS}.

### Step 2. Validate Git Repository and Gather File Information

The **RESPONSE** is "`echo '# GIT_STATUS'; git status --porcelain; echo '# MODIFIED_FILES'; git diff --name-only; echo '# STAGED_FILES'; git diff --cached --name-only; echo '# UNTRACKED_FILES'; git ls-files --others --exclude-standard; echo '# DELETED_FILES'; git diff --name-only --diff-filter=D; echo '# REPO_CHECK'; git rev-parse --git-dir 2>/dev/null && echo 'VALID_REPO' || echo 'NOT_A_REPO'`"

### Step 3. Extract File Lists from Response

Extract **GIT_STATUS**, **MODIFIED_FILES**, **STAGED_FILES**, **UNTRACKED_FILES**, **DELETED_FILES**, and **REPO_CHECK** from {RESPONSE}.

If **REPO_CHECK** is "NOT_A_REPO", display "❌ Error: Not in a git repository" and **hard stop**.

If **GIT_STATUS** is empty, display "✅ No changes to commit - working directory clean" and **hard stop**.

### Step 4. Display Repository Summary

Display repository status summary:
- Modified (unstaged): {count of MODIFIED_FILES} files
- Staged: {count of STAGED_FILES} files
- Untracked: {count of UNTRACKED_FILES} files
- Deleted: {count of DELETED_FILES} files

## Phase 2. File Analysis and Commit Strategy

### Step 5. Analyze File Changes

For each file in **MODIFIED_FILES**, **STAGED_FILES**, **UNTRACKED_FILES**, and **DELETED_FILES**:

1. Determine file type and category:
   - Documentation: .md, .txt, .rst, README*, CHANGELOG*, LICENSE*
   - Configuration: .json, .yaml, .yml, .toml, .ini, .conf, .config
   - Code: .py, .js, .ts, .java, .cpp, .c, .go, .rs, .php, .rb
   - Tests: *test*, *spec*, *Test*, *Spec*
   - Build: Makefile, Dockerfile, docker-compose*, package.json, requirements.txt, Cargo.toml, build.gradle
   - Assets: .png, .jpg, .svg, .css, .scss, .html

2. Analyze change type:
   - Added: New files (untracked)
   - Modified: Existing files with changes
   - Deleted: Removed files
   - Renamed: Files that have been moved/renamed

### Step 6. Generate Commit Strategy

Based on the analysis:

1. **Single File Changes**: If only one file changed, create a focused commit for that file
2. **Related File Changes**: Group related files (e.g., multiple test files, multiple config files)
3. **Mixed Changes**: If comprehensive mode, analyze relationships between files
4. **Large Changes**: If many files changed, consider breaking into logical commits

### Step 7. Create Smart Commit Messages

Generate conventional commit messages following this format:
```
<type>(<scope>): <description>

[optional body]

[optional footer]
```

**Types:**
- `feat`: New features, additions
- `fix`: Bug fixes
- `docs`: Documentation changes
- `style`: Code style/formatting
- `refactor`: Code restructuring
- `test`: Test additions/modifications
- `chore`: Maintenance tasks
- `build`: Build system changes
- `ci`: CI/CD changes
- `perf`: Performance improvements

**Smart Scope Detection:**
- Use file path as scope when relevant (e.g., `feat(auth):`, `fix(api):`)
- Use file type for generic scopes (e.g., `docs(readme):`, `test(unit):`)
- Use component names when identifiable

**Message Generation Rules:**
- Keep description under 50 characters
- Use imperative mood ("add" not "added")
- No period at end of description
- Include relevant details in body for complex changes
- Use breaking change footer when applicable

## Phase 3. Execute Commits

### Step 8. Stage and Commit Files

For each identified commit group:

1. Stage the relevant files: `git add <files>`
2. Create commit: `git commit -m "<message>"`
3. Verify commit success

### Step 9. Handle Edge Cases

- **Merge Conflicts**: Detect and report merge conflicts
- **Uncommitted Changes**: Ensure all changes are properly staged
- **Empty Commits**: Prevent empty commits unless explicitly requested
- **Large Commits**: Warn about commits with too many files

### Step 10. Final Verification

After all commits:
- Display final repository status
- Show recent commit history
- Provide summary of changes committed

## Comprehensive Mode Features

When **COMPREHENSIVE** is "true":
- Analyze file relationships and dependencies
- Detect breaking changes
- Generate more detailed commit messages
- Consider impact on other parts of the codebase
- Suggest commit message improvements

## Error Handling

- Invalid repository: Stop with clear error message
- No changes: Stop with informative message
- Git command failures: Report specific errors
- Permission issues: Provide guidance on resolution

Arguments: {{args}}
"""
