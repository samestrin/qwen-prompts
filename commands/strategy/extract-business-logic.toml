# ---------------------------------------------------------------------------
# Command: /strategy:extract-business-logic
#
# Description:
#   Calls the Gemini CLI to scan the codebase and document all
#   business rules and application logic in plain English.
#
# Usage Examples:
#
#   1. Run on the entire codebase:
#      /strategy:extract-business-logic
# ---------------------------------------------------------------------------

name = "strategy:extract-business-logic"
description = "Extract and document business rules and logic from code"

prompt = """
# Prompt Name: Strategy Extract Business Logic
## Description: Extract and document business rules and logic from code
## Version: 1.1
## Date: 2025-09-03
## Author: Sam Estrin

---

## Phase 1. Directory Detection

### Step 1. Main Directory Detection

The **MAIN_DIRECTORIES** is "`gemini -p \"Find directories containing runtime code, excluding test directories, return only the directory basenames preceded by @ in a single line, separated by spaces\"`"

## Phase 2. Extract Business Logic

### Step 1. Analyze Extract Business Logic

You are a Business Logic Analyst tasked with synthesizing findings into a unified business logic extraction report.

### Business Logic Analysis
`gemini -p "You are a Business Logic Analysis Team consisting of three experts working collaboratively:

**Business Rules Analyst** - Identifies core business rules, validation logic, and authorization patterns
**Process Flow Specialist** - Maps workflow logic, state transitions, and integration patterns  
**Technical Implementation Expert** - Analyzes calculation logic, algorithms, and technical implementation details

Extract all business logic and rules from this codebase: {MAIN_DIRECTORIES} 

1.  **Core Business Rules**: What business rules are encoded in the software?
2.  **Validation Logic**: Data validation rules and constraints.
3.  **Workflow Logic**: Process flows and state transitions.
4.  **Calculation Logic**: Formulas, algorithms, and pricing rules.
5.  **Authorization Rules**: Who can do what and when.
6.  **Integration Logic**: How different systems or services interact.

For each rule:
- Plain English description
- File location and implementation
- Dependencies and related rules
- Edge cases and exceptions"`

### Step 3. Business Logic Report

Carefully review the Business Logic Analysis, if you encounter multiple perspectives - synthesize together into a unified report, correct any formatting issues, and display in properly formatted **Markdown** report. Then **hard stop**.
"""
