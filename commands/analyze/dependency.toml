# ---------------------------------------------------------------------------
# Command: /analyze:dependency
#
# Description:
#   Calls the Gemini CLI to analyze project dependencies.
#
# Usage Examples:
#
#   1. Run a general analysis:
#      /analyze:dependency
#
#   2. Focus on a specific package manager:
#      /analyze:dependency focusing on npm dependencies
# ---------------------------------------------------------------------------

name = "analyze:dependency"
description = "Analyze project dependencies, their usage, and potential issues"

prompt = """
# Prompt Name: Analyze Dependency
## Description: Calls the Gemini CLI to analyze project dependencies.
## Version: 1.1
## Date: 2025-08-31
## Author: Sam Estrin

---

## Phase 1: Dependency File Identification

### Step 1. Attempt to Identify Dependency Files

The **DEPENDENCY_FILES** is "`files=(package.json requirements.txt composer.json Gemfile go.mod Cargo.toml pom.xml build.gradle package-lock.json yarn.lock Pipfile.lock Gemfile.lock go.sum Cargo.lock ./lib/ ./src/); existing_files=\"\"; for file in \"${files[@]}\"; do if [ -e \"$file\" ]; then existing_files=\"$existing_files @$file\"; fi; done; if [ -z \"$existing_files\" ]; then existing_files=\"@. (no standard dependency files found - analyzing current directory)\"; fi; echo \"$existing_files\"`"

If {DEPENDENCY_FILES} contains no standard dependency files, the analysis will proceed with the current directory to identify any non-standard dependency management or embedded dependencies.

## Phase 2: Dependency Analysis

### Step 1. Generate Dependency Analysis

You are an expert software architect/engineer.

#### Dependency Analysis
`gemini -p "{DEPENDENCY_FILES} You are a team of dependency experts working together - a dependency management specialist, software architect, and DevOps engineer. Each team member must provide their individual analysis from their expertise perspective, then work together to create a comprehensive dependency analysis that leverages the teams inputs into a single unified report.

**Team Roles:**
- **Dependency Management Specialist**: Expert in package managers, version management, dependency optimization, bundle analysis, and usage patterns
- **Software Architect**: Expert in system design, dependency relationships, architectural patterns, and technical debt assessment
- **DevOps Engineer**: Expert in build processes, deployment dependencies, environment management, and CI/CD integration

**Each team member must provide individual analysis first, then collaborate on a unified report.** {{args}}

1.  **Dependency Overview**: Total number of dependencies, main package manager(s) used.
2.  **Direct Dependencies**: List major dependencies with their versions and purpose.
3.  **Dependency Usage Analysis**: Which dependencies are actively used vs. unused?
4.  **Version & Update Analysis**: Are there outdated dependencies or available updates?
5.  **Bundle Size & Performance**: Identify large dependencies affecting bundle size.
6.  **Dependency Issues**: Look for conflicting versions, missing dependencies, or circular dependencies.
7.  **Recommendations**: Suggest dependencies to update or remove, version upgrades, and optimizations.

Include specific examples of dependency usage in the codebase with file references."`

### Step 2. Generate Dependency Analysis Report

Carefully review the Dependency Analysis, if you encounter multiple perspectives - synthesize together into a unified report, correct any formatting issues, and display in properly formatted **Markdown** report. Do not show any Todos/Task Lists, end with the report. Then **hard stop**.
"""
