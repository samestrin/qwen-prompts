# ---------------------------------------------------------------------------
# Command: /analyze:repo
#
# Description:
#   Calls shell commands to complete a repository analysis of the current directory.
#
# Usage:
#   /analyze:repo
# ---------------------------------------------------------------------------

name = "analyze:repo"
description = "Repository analysis with comprehensive statistics and insights"

prompt = """
# Prompt Name: Analyze Repo
## Description: Repository analysis with comprehensive statistics and insights
## Version: 1.1
## Date: 2025-09-02
## Author: Sam Estrin

---

## Phase 1. Repository Analysis

### Step 1. Collect Repository Statics 

You are an expert software architect with extensive experience in codebase assessment and project evaluation.

Perform a comprehensive analysis of this repository. Start by gathering repository statistics using shell commands, then provide detailed insights.

#### Repo Analysis

The **REPOSITORY_STATS** is "`# Basic Repository Stats
echo "=== Repository Analysis ==="
echo -n "Repository: "
pwd | xargs basename
echo -n "Date: "
date '+%B %d, %Y %I:%M:%S%p'
echo ""

# Repository size and file counts
echo "--- Basic Repository Stats ---"
echo -n "Total size: "
du -sh . 2>/dev/null | cut -f1
echo -n "Total files: "
if [ -d ".git" ]; then
    git ls-files | wc -l | tr -d ' '
else
    find . -type f \\( ! -path "./venv/*" ! -path "./node_modules/*" ! -path "./.git/*" ! -path "./build/*" ! -path "./dist/*" ! -path "./target/*" ! -path "./__pycache__/*" ! -path "./vendor/*" \\) | wc -l | tr -d ' '
fi
echo -n "Total directories: "
find . -type d \\( ! -path "./venv/*" ! -path "./node_modules/*" ! -path "./.git/*" ! -path "./build/*" ! -path "./dist/*" ! -path "./target/*" ! -path "./__pycache__/*" ! -path "./vendor/*" \\) | wc -l | tr -d ' '
echo ""

# Code statistics by language
echo "--- Code Statistics ---"
echo "Lines of code by file type:"
if [ -d ".git" ]; then
    echo -n "  JavaScript/TypeScript: "
    git ls-files | grep -E '\\.(js|ts|jsx|tsx)$' | xargs wc -l 2>/dev/null | tail -1 | awk '{print $1}' || echo '0'
    echo -n "  Python: "
    git ls-files | grep -E '\\.py$' | xargs wc -l 2>/dev/null | tail -1 | awk '{print $1}' || echo '0'
    echo -n "  Java: "
    git ls-files | grep -E '\\.java$' | xargs wc -l 2>/dev/null | tail -1 | awk '{print $1}' || echo '0'
    echo -n "  C/C++: "
    git ls-files | grep -E '\\.(c|cpp|h|hpp)$' | xargs wc -l 2>/dev/null | tail -1 | awk '{print $1}' || echo '0'
    echo -n "  Go: "
    git ls-files | grep -E '\\.go$' | xargs wc -l 2>/dev/null | tail -1 | awk '{print $1}' || echo '0'
    echo -n "  Rust: "
    git ls-files | grep -E '\\.rs$' | xargs wc -l 2>/dev/null | tail -1 | awk '{print $1}' || echo '0'
    echo -n "  PHP: "
    git ls-files | grep -E '\\.php$' | xargs wc -l 2>/dev/null | tail -1 | awk '{print $1}' || echo '0'
    echo -n "  Ruby: "
    git ls-files | grep -E '\\.rb$' | xargs wc -l 2>/dev/null | tail -1 | awk '{print $1}' || echo '0'
    echo -n "  Shell: "
    git ls-files | grep -E '\\.(sh|bash)$' | xargs wc -l 2>/dev/null | tail -1 | awk '{print $1}' || echo '0'
else
    echo -n "  JavaScript/TypeScript: "
    find . -name '*.js' -o -name '*.ts' -o -name '*.jsx' -o -name '*.tsx' | grep -v -E '(venv|node_modules|\\.git|build|dist|target|__pycache__|vendor)/' | xargs wc -l 2>/dev/null | tail -1 | awk '{print $1}' || echo '0'
    echo -n "  Python: "
    find . -name '*.py' | grep -v -E '(venv|node_modules|\\.git|build|dist|target|__pycache__|vendor)/' | xargs wc -l 2>/dev/null | tail -1 | awk '{print $1}' || echo '0'
    echo -n "  Java: "
    find . -name '*.java' | grep -v -E '(venv|node_modules|\\.git|build|dist|target|__pycache__|vendor)/' | xargs wc -l 2>/dev/null | tail -1 | awk '{print $1}' || echo '0'
    echo -n "  C/C++: "
    find . -name '*.c' -o -name '*.cpp' -o -name '*.h' -o -name '*.hpp' | grep -v -E '(venv|node_modules|\\.git|build|dist|target|__pycache__|vendor)/' | xargs wc -l 2>/dev/null | tail -1 | awk '{print $1}' || echo '0'
    echo -n "  Go: "
    find . -name '*.go' | grep -v -E '(venv|node_modules|\\.git|build|dist|target|__pycache__|vendor)/' | xargs wc -l 2>/dev/null | tail -1 | awk '{print $1}' || echo '0'
    echo -n "  Rust: "
    find . -name '*.rs' | grep -v -E '(venv|node_modules|\\.git|build|dist|target|__pycache__|vendor)/' | xargs wc -l 2>/dev/null | tail -1 | awk '{print $1}' || echo '0'
    echo -n "  PHP: "
    find . -name '*.php' | grep -v -E '(venv|node_modules|\\.git|build|dist|target|__pycache__|vendor)/' | xargs wc -l 2>/dev/null | tail -1 | awk '{print $1}' || echo '0'
    echo -n "  Ruby: "
    find . -name '*.rb' | grep -v -E '(venv|node_modules|\\.git|build|dist|target|__pycache__|vendor)/' | xargs wc -l 2>/dev/null | tail -1 | awk '{print $1}' || echo '0'
    echo -n "  Shell: "
    find . -name '*.sh' -o -name '*.bash' | grep -v -E '(venv|node_modules|\\.git|build|dist|target|__pycache__|vendor)/' | xargs wc -l 2>/dev/null | tail -1 | awk '{print $1}' || echo '0'
fi
echo ""

# Project structure analysis
echo "--- Project Structure ---"
echo -n "Directory depth: "
find . -type d \\( ! -path "./venv/*" ! -path "./node_modules/*" ! -path "./.git/*" ! -path "./build/*" ! -path "./dist/*" ! -path "./target/*" ! -path "./__pycache__/*" ! -path "./vendor/*" \\) | awk -F/ '{print NF-1}' | sort -n | tail -1
echo -n "Source directories: "
find . -type d \\( -name src -o -name source -o -name lib -o -name app \\) \\( ! -path "./venv/*" ! -path "./node_modules/*" ! -path "./.git/*" ! -path "./build/*" ! -path "./dist/*" ! -path "./target/*" ! -path "./__pycache__/*" ! -path "./vendor/*" \\) | wc -l | tr -d ' '
echo -n "Test directories: "
find . -type d \\( -name test -o -name tests -o -name __tests__ -o -name spec \\) \\( ! -path "./venv/*" ! -path "./node_modules/*" ! -path "./.git/*" ! -path "./build/*" ! -path "./dist/*" ! -path "./target/*" ! -path "./__pycache__/*" ! -path "./vendor/*" \\) | wc -l | tr -d ' '
echo -n "Documentation directories: "
find . -type d \\( -name docs -o -name doc -o -name documentation \\) \\( ! -path "./venv/*" ! -path "./node_modules/*" ! -path "./.git/*" ! -path "./build/*" ! -path "./dist/*" ! -path "./target/*" ! -path "./__pycache__/*" ! -path "./vendor/*" \\) | wc -l | tr -d ' '
echo ""

# File type distribution
echo "--- File Type Distribution ---"
echo "Top 10 file extensions:"
if [ -d ".git" ]; then
    git ls-files | grep '\\.' | sed 's/.*\\.//' | sort | uniq -c | sort -nr | head -10 | awk '{printf "  .%s: %s files\\n", $2, $1}'
else
    find . -type f -name '*.*' \\( ! -path "./venv/*" ! -path "./node_modules/*" ! -path "./.git/*" ! -path "./build/*" ! -path "./dist/*" ! -path "./target/*" ! -path "./__pycache__/*" ! -path "./vendor/*" \\) | sed 's/.*\\.//' | sort | uniq -c | sort -nr | head -10 | awk '{printf "  .%s: %s files\\n", $2, $1}'
fi
echo ""

# Git repository metrics
if [ -d ".git" ]; then
    echo "--- Git Repository Metrics ---"
    echo -n "Total commits: "
    git rev-list --all --count 2>/dev/null || echo 'N/A'
    echo -n "Contributors: "
    git shortlog -sn --all 2>/dev/null | wc -l | tr -d ' ' || echo 'N/A'
    echo -n "Branches: "
    git branch -a 2>/dev/null | wc -l | tr -d ' ' || echo 'N/A'
    echo -n "Repository age: "
    git log --reverse --format='%ai' | head -1 | cut -d' ' -f1 || echo 'N/A'
    echo -n "Last commit: "
    git log -1 --format='%ai' | cut -d' ' -f1 || echo 'N/A'
else
    echo "--- Git Repository Metrics ---"
    echo "Not a Git repository"
fi
echo ""

# Complexity indicators
echo "--- Complexity Indicators ---"
echo "Largest files (by lines):"
if [ -d ".git" ]; then
    git ls-files | grep -E '\\.(js|ts|py|java|go|rs|php|rb|c|cpp)$' | grep -v -E '(test|tests|__tests__|spec|specs)/' | xargs wc -l 2>/dev/null | sort -nr | head -5 | awk '{printf "  %s: %s lines\\n", $2, $1}'
else
    find . -type f \\( -name '*.js' -o -name '*.ts' -o -name '*.py' -o -name '*.java' -o -name '*.go' -o -name '*.rs' -o -name '*.php' -o -name '*.rb' -o -name '*.c' -o -name '*.cpp' \\) \\( ! -path "./venv/*" ! -path "./node_modules/*" ! -path "./.git/*" ! -path "./build/*" ! -path "./dist/*" ! -path "./target/*" ! -path "./__pycache__/*" ! -path "./vendor/*" ! -path "./test/*" ! -path "./tests/*" ! -path "./__tests__/*" ! -path "./spec/*" ! -path "./specs/*" \\) | xargs wc -l 2>/dev/null | sort -nr | head -5 | awk '{printf "  %s: %s lines\\n", $2, $1}'
fi
echo ""
echo "Configuration files:"
find . -maxdepth 2 -type f \\( -name '*.json' -o -name '*.yaml' -o -name '*.yml' -o -name '*.toml' -o -name '*.ini' -o -name '*.conf' -o -name '*.config' \\) | head -10
echo ""
echo "Dependency files:"
find . -maxdepth 2 -type f \\( -name 'package.json' -o -name 'requirements.txt' -o -name 'Gemfile' -o -name 'pom.xml' -o -name 'build.gradle' -o -name 'Cargo.toml' -o -name 'go.mod' -o -name 'composer.json' \\) 2>/dev/null
echo ""`"

### Step 2. Repository Report Formatting

You are an expert in **Markdown**. Your job is to carefully review this text based report, and convert it into a summary report using Markdown tables; strip out table entries with 0 as their value and **minimize whitespace before and after tables**. this summary report is the **SUMMARY_REPORT**: 

{REPOSITORY_STATS}

### Step 3. Repository Analysis

**CRITICAL REQUIREMENT**: Begin your response displaying the {SUMMARY_REPORT}

After presenting the formatted report, provide a comprehensive analysis of {REPOSITORY_STATS} covering:

#### 1. Project Classification & Technology Stack
- **Primary Language**: Identify the dominant programming language
- **Technology Stack**: Analyze the technology choices and frameworks
- **Project Type**: Classify as library, application, tool, framework, etc.
- **Architecture Pattern**: Identify architectural patterns and design approaches

#### 2. Code Quality Assessment
- **Code Organization**: Evaluate directory structure and file organization
- **Complexity Analysis**: Assess codebase complexity based on file sizes and structure
- **Documentation Coverage**: Review documentation quality and completeness
- **Testing Strategy**: Analyze test coverage and testing approaches

#### 3. Development Practices
- **Version Control**: Evaluate Git usage patterns and commit history
- **Dependency Management**: Review dependency files and package management
- **Configuration Management**: Assess configuration file organization
- **Build and Deployment**: Identify build tools and deployment strategies

#### 4. Maintainability & Scalability
- **Code Maintainability**: Assess factors affecting long-term maintenance
- **Scalability Considerations**: Identify potential scaling challenges
- **Technical Debt Indicators**: Highlight areas of concern
- **Refactoring Opportunities**: Suggest improvement areas

#### 5. Security & Best Practices
- **Security Considerations**: Identify potential security concerns
- **Best Practice Adherence**: Evaluate adherence to industry standards
- **Performance Implications**: Assess performance-related factors
- **Compliance**: Check for license files and compliance indicators

### Step 4. Recommendations & Action Items

Provide specific, actionable recommendations for:
- **Immediate Improvements**: Quick wins and low-effort enhancements
- **Medium-term Goals**: Strategic improvements requiring moderate effort
- **Long-term Vision**: Major architectural or structural changes
- **Risk Mitigation**: Address identified risks and vulnerabilities

### Step 5. Final Repository Report Formatting

Format a comprehensive response as a professional repository assessment report suitable for technical stakeholders, project managers, and development teams. Do not show any Todos/Task Lists, end with the report. Then **hard stop**.
"""