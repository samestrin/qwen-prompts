# ---------------------------------------------------------------------------
# Command: /analyze:security
#
# Description:
#   Calls the Gemini CLI to perform a comprehensive security analysis.
#
# Usage Examples:
#
#   1. Run a general audit:
#      /analyze:security
#
#   2. Run a comprehensive audit:
#      /analyze:security --comprehensive
#
#   3. Focus on a specific area:
#      /analyze:security focusing on authentication and authorization
# ---------------------------------------------------------------------------

name = "analyze:security"
description = "Perform security analysis of the codebase"

prompt = """
# Prompt Name: Analyze Security
## Description: Perform (comprehensive) security analysis of the codebase
## Version: 1.1
## Date: 2025-09-02
## Author: Sam Estrin

---

## Phase 1. Setup

### Step 1. Quick Setup

**Set mode based on "{{args}}":**
1. CLEAN_ARGS (string) is "{{args}}"
2. If "{CLEAN_ARGS}" contains `@`, **TARGETS** is the path/to/filename(s) including `@`, otherwise **TARGETS** is "false". Remove {TARGETS} from {CLEAN_ARGS}.
3. If "{CLEAN_ARGS}" contains "--comprehensive", **COMPREHENSIVE** is "true" and **REPORT_TITLE** is "Comprehensive Security Analysis", otherwise "false" and **REPORT_TITLE** is "Security Analysis". Remove "--comprehensive" from {CLEAN_ARGS}.

Say "Generating {REPORT_TITLE} report ... [Mode: Comprehensive:{COMPREHENSIVE}, Target(s):{TARGETS}]"

### Step 2. Conditional Directory Detection

**If {TARGETS} is not "false" the **MAIN_DIRECTORIES** is "{TARGETS}"

**If {TARGETS} is "false"** the **MAIN_DIRECTORIES** is "`gemini -p \"Find ALL directories with code, including tests - for a security review, return only the directory basenames preceded by @ in a single line, separated by spaces\"`"

## Phase 2. Security Analysis

### Step 1. Generate Security Analysis

You are an expert security consultant providing professional security assessments. You **cannot** install any new tools, you must work with what is available. You **can** suggest the user installs and runs 3rd party tools if applicable.

#### Security Analysis
`gemini -p "{MAIN_DIRECTORIES} 

**ANALYSIS SCOPE**: Focus your security analysis ONLY on the files/directories specified in the above MAIN_DIRECTORIES.

**IMPORTANT**: If MAIN_DIRECTORIES contains specific files or a targeted directory (not general project directories), limit your security analysis exclusively to that scope.

You are a team of security experts working together - a security engineer, penetration tester, and compliance specialist. Each team member must provide their individual analysis from their expertise perspective, then work together to create a comprehensive security audit that leverages all of your inputs into a single unified report. {{args}}

1.  **Authentication & Authorization**: JWT/session handling, password hashing, access controls, multi-factor authentication.
2.  **Input Validation & Sanitization**: Protections against SQL injection, XSS, CSRF, command injection, path traversal.
3.  **Data Protection**: Encryption at rest/in transit, sensitive data handling, secret management, PII protection.
4.  **Error Handling**: Information disclosure in errors, proper logging, stack trace exposure.
5.  **Rate Limiting & DoS Protection**: API rate limiting, request size limits, timeouts, resource exhaustion.
6.  **Dependencies**: Analyze package manifests (requirements.txt, package.json, Cargo.toml, go.mod, composer.json) for outdated or vulnerable packages. Use available security scanning tools (pip-audit, npm audit, cargo audit) if present. Check for supply chain security, license compliance, and dependency pinning practices. Exclude virtual environments (venv/, .venv/, node_modules/) from direct analysis - focus on manifest files instead.
7.  **Infrastructure & Configuration**: Environment variables, file permissions, network security, container security.
8.  **API Security**: Endpoint security, parameter validation, response filtering, versioning security.
9.  **Code Security Patterns**: Secure coding practices, dangerous functions, hardcoded secrets, code injection.
10. **Business Logic Security**: Authorization bypass, privilege escalation, workflow manipulation, data integrity.
11. **Monitoring & Incident Response**: Security logging, anomaly detection, audit trails, incident handling.
12. **Compliance & Privacy**: GDPR/CCPA compliance, data retention policies, consent management, audit requirements.

**For each area, provide:**
- ✅ What's implemented well.
- ⚠️ Potential vulnerabilities found (include severity: Critical/High/Medium/Low).
- ❌ Missing security measures (include potential impact assessment).
- 📁 Specific files and line references.
- 💡 Recommendations for improvements (prioritized by risk level)."`

### Step 2. Set Template

#### Professional Security Assessment Template 

##### Executive Summary
- Overall security posture assessment
- Critical findings requiring immediate attention
- Risk level classification (Critical/High/Medium/Low)

##### Security Findings
**Critical Issues** (Immediate Action Required)
- List critical vulnerabilities with business impact
- Specific remediation steps and timelines

**High Priority Issues** (Address Within 30 Days)
- Important security gaps with moderate risk
- Implementation recommendations

**Medium Priority Issues** (Address Within 90 Days)
- Security improvements and best practices
- Preventive measures

**Low Priority Issues** (Future Considerations)
- Minor improvements and optimizations

##### Compliance Assessment
- Regulatory compliance status (GDPR, CCPA, etc.)
- Industry standard adherence
- Audit readiness evaluation

##### Recommendations
- Prioritized action plan
- Resource requirements
- Implementation timeline

##### Security Metrics
- Security score and benchmarking
- Improvement tracking recommendations

##### Technical Analysis _(only included with --comprehensive flag)_
- Detailed Technical Findings 
- Code References (path/to/filenames, function names, line numbers)
- Implementation Details 

##### Suggestions
- Final suggestions

### Step 3. Generate {REPORT_TITLE}

Carefully review the Security Analysis, and display a single, properly formatted **Markdown** report using the **Professional Security Assessment Template**. 

**Important formatting rules:**
- If {COMPREHENSIVE} is "true", include the "##### Technical Analysis" section with detailed technical findings, code references, and implementation details
- If {COMPREHENSIVE} is "false", completely omit the "##### Technical Analysis" section and its content
- Use the {REPORT_TITLE} as the main heading
- Do not show any Todos/Task Lists, end with the report. Then **hard stop**.
"""
