# ---------------------------------------------------------------------------
# Command: /analyze:implementation
#
# Description:
#   Calls the Gemini CLI to check if a specific feature or pattern is
#   implemented in the codebase and provides a detailed report.
#
# Usage Examples:
#
#   1. Check for a feature in default directories ('src/', 'lib/'):
#      /analyze:implementation Has Stripe payment processing been implemented?
#
#   2. Check for a feature in a specific directory:
#      /analyze:implementation In the @api/ and @middleware/ directories, has user authentication been implemented?
# ---------------------------------------------------------------------------

name = "analyze:implementation"
description = "Check if a specific feature or pattern is implemented in the codebase"

prompt = """
# Prompt Name: Analyze Implementation
## Description: Check if a specific feature or pattern is implemented in the codebase
## Version: 1.1
## Date: 2025-08-31
## Author: Sam Estrin

---

## Phase 1. Directory Detection

### Step 1. Validate {{args}} is not NULL

If "{{args}}" is NULL or empty then say "/analyze:implementation <feature or pattern>", and **hard stop**.

### Step 2. Combined Directory Detection and Standards Scan

The **RESPONSE** is "`echo '# MAIN_DIRECTORIES'; gemini -p \"Find directories containing runtime code, excluding test directories, return only the directory basenames preceded by @ in a single line, separated by spaces\"; echo '# CODING_STANDARDS'; cat ./planning/specifications/sprint-coding-standards.md 2>/dev/null || echo 'No coding standards found'; echo '# IMPLEMENTATION_STANDARDS'; cat ./planning/specifications/implementation-standards.md 2>/dev/null || echo 'No implementation standards found - using default analysis approach'`"

### Step 3. Set Defaults

#### Default Implementation Strategy (Eskil Steenberg's Black Box Architecture)

**Black Box Design Principles:**
- Design modules that never need editing once written
- Create primitive-based interfaces that hide complexity
- Implement wrapper patterns for all external dependencies
- Build replaceable components with standardized interfaces
- Optimize for human cognitive load and maintainability

**Architecture Framework:**
1. **Primitive Identification**: Define core data types and operations
2. **Black Box Boundaries**: Create modules with single responsibility
3. **Dependency Wrapping**: Isolate external services behind interfaces
4. **Interface Design**: Hide implementation details, expose only essentials
5. **Replaceability Testing**: Verify components can be substituted

**Implementation Strategy:**
- Write code that works correctly from first deployment
- Build modular boundaries testable in isolation
- Create mock interfaces for external dependencies
- Implement comprehensive logging and state inspection
- Design validation modes for development and testing

**Quality Standards:**
- Test black box interfaces, not internal implementation
- Assess risk through dependency analysis and failure modes
- Maintain clear separation between platform and application logic
- Optimize for team scalability and developer velocity
- Ensure modules can be debugged and replaced independently

### Step 4. Extract from Response

Extract **MAIN_DIRECTORIES**, **CODING_STANDARDS**, and **IMPLEMENTATION_STANDARDS** from {RESPONSE}. If the **MAIN_DIRECTORIES** cannot be extracted, then set **MAIN_DIRECTORIES** to ".". If **CODING_STANDARDS** is "No coding standards found" then set **CODING_STANDARDS** to "Use general best practices". If {IMPLEMENTATION_STANDARDS} is "No implementation standards found - using default analysis approach" then set **IMPLEMENTATION_STANDARDS** to the **Default Implementation Strategy**.

## Phase 2. Implementation Analysis

### Step 1. Generate Implementation Analysis

You are an expert software architect/engineer.

#### Implementation Analysis
`gemini -p "{MAIN_DIRECTORIES} You are a team working together - a software architect, software engineer, and a business analyst. Each team member must provide their individual analysis from their expertise perspective, then work together to create a comprehensive implementation analysis that leverages all of your inputs into a single unified report.

**Coding Standards Reference:**
{CODING_STANDARDS}

**Implementation Standards Reference:**
{IMPLEMENTATION_STANDARDS}

Has the following feature been implemented in this codebase? {{args}}

**Analysis Framework:**
1.  **Implementation Status**: Yes/No with confidence level (0-100%)
2.  **Relevant Files**: List all files containing related code with file paths
3.  **Code Examples**: Show specific functions, classes, or code blocks that implement this
4.  **Implementation Details**: How it's implemented, what approach is used
5.  **Standards Compliance**: If implementation standards are available, evaluate compliance
6.  **Coverage**: How complete is the implementation? Any gaps or missing components?
7.  **Dependencies**: External libraries, services, or internal modules it relies on
8.  **Usage Examples**: How this feature is used throughout the codebase
9.  **Testing Coverage**: Unit, integration, or end-to-end tests present
10. **Error Handling**: Error handling patterns, logging, and failure scenarios
11. **Configuration**: Environment variables, config files, or setup requirements
12. **Related Features**: Connected functionality that works with this feature
13. **Architecture Patterns**: Design patterns, architectural decisions used

**If not implemented:**
- Suggest implementation location and approach
- Recommend architecture patterns based on project structure
- Consider implementation standards if available

**Output Format:** Structured markdown with clear sections and actionable insights."`

### Step 2. Generate Implementation Analysis Report

Carefully review the Implementation Analysis, if you encounter multiple perspectives - synthesize together into a unified report, correct any formatting issues, and display in properly formatted **Markdown** report. Do not show any Todos/Task Lists, end with the report. Then **hard stop**.
"""
