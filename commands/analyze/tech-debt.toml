# ---------------------------------------------------------------------------
# Command: /analyze:tech-debt
#
# Description:
#   Calls the Gemini CLI to identify and prioritize technical debt.
#
# Usage Examples:
#
#   1. Run a general analysis:
#      /analyze:tech-debt
#
#   2. Focus on a specific severity:
#      /analyze:tech-debt focusing on critical severity issues
# ---------------------------------------------------------------------------

name = "analyze:tech-debt"
description = "Identify and prioritize technical debt across the codebase"

prompt = """
# Prompt Name: Analyze Technical Debt
## Description: Identify and prioritize technical debt across the codebase
## Version: 1.1
## Date: 2025-09-02
## Author: Sam Estrin

---

## Phase 1. Directory Detection

### Step 1. Combined Directory Detection

The **RESPONSE** is "`echo '# MAIN_DIRECTORIES'; gemini -p \"Find ALL directories with code, including tests - for technical debt analysis, return only the directory basenames preceded by @ in a single line, separated by spaces\"; echo '# CODING_STANDARDS'; cat ./planning/specifications/sprint-coding-standards.md 2>/dev/null || echo 'No coding standards found'; echo '# IMPLEMENTATION_STANDARDS'; cat ./planning/specifications/implementation-standards.md 2>/dev/null || echo 'No implementation standards found'`"

## Phase 2. Technical Debt Analysis

### Step 1. Extract Standards and Directories

Extract **MAIN_DIRECTORIES**, **CODING_STANDARDS**, and **IMPLEMENTATION_STANDARDS** from {RESPONSE}. If the **MAIN_DIRECTORIES** cannot be extracted, then set **MAIN_DIRECTORIES** to ".". If **CODING_STANDARDS** is "No coding standards found" then set **CODING_STANDARDS** to "Use general best practices". If **IMPLEMENTATION_STANDARDS** is "No implementation standards found" then set **IMPLEMENTATION_STANDARDS** to "Use general implementation best practices".

### Step 2. Generate Technical Debt Analysis

You are an expert software architect/engineer.

# Technical Debt Analysis
`gemini -p "{MAIN_DIRECTORIES} You are a team of technical debt experts working together - a software architect, technical debt specialist, and engineering manager. Each team member must provide their individual analysis from their expertise perspective, then work together to create a comprehensive technical debt analysis that leverages all of your inputs into a single unified report. 

{{args}}

1.  **Code Debt**: Outdated patterns, TODOs, commented-out code, workarounds.
2.  **Architecture Debt**: Inconsistencies, tight coupling, circular dependencies.
3.  **Technology Debt**: Outdated dependencies, legacy code, security vulnerabilities.
4.  **Documentation Debt**: Missing or outdated docs, unclear APIs.
5.  **Test Debt**: Missing coverage, brittle tests, slow test suites.
6.  **Performance Debt**: Known bottlenecks, inefficient algorithms, missing caching.

**Debt Prioritization Matrix:**
For each debt item identified:
- 🔴 Critical (fix immediately)
- 🟠 High (fix within sprint)
- 🟡 Medium (fix within quarter)
- 🟢 Low (fix when convenient)

**Impact Assessment:**
- Development velocity impact
- Maintenance burden
- Security/reliability risks
- Performance implications

**Remediation Plan:**
- Quick wins (< 1 day effort)
- Short-term fixes (1-5 days)
- Long-term refactoring (weeks/months)
- Estimated effort for each major item"`

**Coding Standards:**
{CODING_STANDARDS}

**Implementation Standards:**
{IMPLEMENTATION_STANDARDS}
---

### Step 4. Generate Technical Debt Analysis Report

Carefully review the Technical Debt Analysis, correct any formatting issues, and display in properly formatted **Markdown** report. Then **hard stop**.
"""
